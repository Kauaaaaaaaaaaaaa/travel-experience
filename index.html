<!DOCTYPE html>
<html lang="pt-BR">
<title>Loja de roupas 67</title>
<link rel="stylesheet" href="/css/style.css">
<head>

    <header>
        <h1>👕Loja de Roupas</h1>
    </header>
    <main class="area-contato">
        <form class="formulario">
            <h2>Fale com a gente</h2>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required minlength="3"><br><br>
            <label for="email">E-mail</label><br><br>
            <input type="email" id="email" placeholder="seu@email.com" required><br><br>
            <label for="telefone">Telefone:</label><br><br>
            <input type="tel" id="telefone" placeholder="(51) 99999-9999"><br><br>
            <label for="nascimento">Data de nascimento</label><br><br>
            <input type="date" id="nascimento" required><br><br>
            <label for="tamanho">Tamanho (número de 34 a 46)</label><br><br>
            <input type="number" id="tamanho" min="34" max="46" step="2" placeholder="ex: 38"><br><br>
            <label for="produto">Produto de interesse</label>
            <select name="produto" required>
                <option value="">Escolha um produto</option>
                <option value="camiseta">Camiseta</option>
                <option value="calca">Calça</option>
                <option value="jaqueta">Jaqueta</option>
            </select>
            <fieldset>
                <legend>Forma de contato preferida</legend>
                <label><input type="radio" name="contato"value="telefone">Telefone</label>
                    <label><input type="radio" name="contato"value="whatsapp">Whatsapp</label>
                    <label><input type="radio" name="contato"value="email" checked>E-mail</label>
            </fieldset>
            <fieldset>
                <legend>interesse</legend>
                <label><input type="checkbox" name="interesse" value="promocoes">Promoções</label>
                <label><input type="checkbox" name="interesse" value="novidades">Novidades</label>
                <label><input type="checkbox" name="interesse" value="novidades">Eventos</label>
            </fieldset>
            <label for="mensagem">Mensagem</label>
            <textarea name="mensagem" id="mensagem" placeholder="Escreva sua dúvida" maxlength="200"></textarea>

            <button type="submit">Enviar</button>
        </form>
    </main>
</body>
</html>
